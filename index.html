<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Link Profile</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
    <style>
      * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  position: relative;
  background-color: #000; /* สีสำรองกรณีวิดีโอโหลดไม่ขึ้น */
}

/* ============================================================
   การจัดสไตล์วิดีโอพื้นหลัง (Full Screen Video Background)
   ============================================================ */
#bgVideo {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  width: auto;
  height: auto;
  z-index: -2; /* ให้อยู่หลังสุด */
  object-fit: cover; /* ขยายวิดีโอให้เต็มจอโดยไม่เสียสัดส่วน */
}

/* เงามืดบางๆ ทับวิดีโอเพื่อช่วยให้ตัวหนังสือบนการ์ดอ่านง่ายขึ้น */
.video-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.3);
  z-index: -1;
}

/* ============================================================
   การ์ด Glassmorphism
   ============================================================ */
.card {
  position: relative;
  width: 320px;
  padding: 35px 25px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border-radius: 20px;
  border: 1.5px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.3),
              0 0 40px rgba(186, 104, 200, 0.2);
  text-align: center;
  color: #fff;
  z-index: 1;
}

/* รูปโปรไฟล์ */
.avatar-wrapper {
  position: relative;
  width: 95px;
  height: 95px;
  margin: 0 auto 15px;
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.8);
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
}

/* ชื่อ */
.name {
  font-size: 1.6rem;
  font-weight: bold;
  margin-bottom: 25px;
}

/* โซน Social Media Icons */
.social-links {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-bottom: 25px;
}

.social-btn {
  font-size: 2rem;
  color: rgba(255, 255, 255, 0.5);
  text-decoration: none;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: inline-block;
}

.social-btn:hover {
  transform: translateY(-5px) scale(1.25);
  color: #ffffff;
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.9),
               0 0 20px rgba(255, 255, 255, 0.6);
}

/* ตอนกดไอคอน (Active Colors) */
.social-btn.facebook.active,
.social-btn.facebook:active {
  color: #1877f2;
  text-shadow: 0 0 15px #1877f2, 0 0 30px rgba(24, 119, 242, 0.8);
}

.social-btn.instagram.active,
.social-btn.instagram:active {
  color: #e1306c;
  text-shadow: 0 0 15px #e1306c, 0 0 30px rgba(225, 48, 108, 0.8);
}

.social-btn.tiktok.active,
.social-btn.tiktok:active {
  color: #ffffff;
  text-shadow: -2px 2px 10px #ff0050, 2px -2px 10px #00f2fe;
}

.social-btn.discord.active,
.social-btn.discord:active {
  color: #5865f2;
  text-shadow: 0 0 15px #5865f2, 0 0 30px rgba(88, 101, 242, 0.8);
}

/* ส่วนท้าย: เครดิตจัดทำ / ร้านค้า */
.footer-credit {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.7);
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  padding-top: 15px;
}

.footer-credit a {
  color: #00ffff;
  text-decoration: none;
  font-weight: bold;
  transition: color 0.2s ease;
}

.footer-credit a:hover {
  color: #ffffff;
  text-decoration: underline;
}

      </style>
  
</head>
<body>

  <video autoplay loop muted playsinline id="bgVideo">
    <source src="https://www.image2url.com/r2/default/videos/1785059460427-291163af-cfe1-4273-b45e-0d6b3eb894e6.mp4" type="video/mp4">
    เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอนี้
  </video>

  <div class="video-overlay"></div>

  <div class="card" id="profileCard">
    
    <div class="avatar-wrapper">
      <img class="avatar" src="https://cdn.phototourl.com/free/2026-07-26-3c5c57a5-7992-4555-9474-6d93800c9a07.webp" alt="Profile Avatar">
    </div>

    <div class="name">@ch_in2554</div>

    <div class="social-links">
      <a href="https://www.facebook.com/share/18vLs99SnY/" target="_blank" class="social-btn facebook" onclick="setActive(this)">
        <i class="fa-brands fa-facebook"></i>
      </a>
      <a href="https://www.instagram.com/ch__in2554?igsh=NWViaGFta3plbXNq" target="_blank" class="social-btn instagram" onclick="setActive(this)">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://www.tiktok.com/@chin2011_2554?_r=1&_t=ZS-98LtzwTnspQ" target="_blank" class="social-btn tiktok" onclick="setActive(this)">
        <i class="fa-brands fa-tiktok"></i>
      </a>
      <a href="..." target="_blank" class="social-btn discord" onclick="setActive(this)">
        <i class="fa-brands fa-discord"></i>
      </a>
    </div>

    <div class="footer-credit">
      สนใจทำเว้บ ไบโอ สวยๆ-เท่ๆแบบนี้ติดต่อได้นี้ <a href="https://www.instagram.com/ch__in2554?igsh=NWViaGFta3plbXNq" target="_blank"> <br> (คลิกเลย)</a>
    </div>

  </div>

  <script>
    function setActive(element) {
      const buttons = document.querySelectorAll('.social-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }
  </script>

</body>
</html>
